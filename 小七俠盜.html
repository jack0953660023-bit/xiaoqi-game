<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>小七俠盜</title>
<style>
:root{--shell:#7d86c2;--dark:#262a52;--bg:#1b1d33;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--shell:#5d659e;--bg:#10121f}}
:root[data-theme="dark"]{--shell:#5d659e;--bg:#10121f}
html,body{height:100%;margin:0;background:var(--bg);touch-action:none;user-select:none;-webkit-user-select:none}
body{display:flex;align-items:center;justify-content:center;font-family:"Noto Sans TC","PingFang TC",sans-serif}
#gba{width:min(100vw,480px);max-height:100%;background:var(--shell);border-radius:18px 18px 56px 56px;padding:14px 12px 22px;box-sizing:border-box}
#scr{background:#15162b;padding:10px;border-radius:8px}
canvas{width:100%;display:block;image-rendering:pixelated;aspect-ratio:3/2;background:#000}
#pad{display:flex;justify-content:space-between;align-items:center;padding:14px 8px 0}
#dp{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px)}
#ab{display:flex;gap:16px;transform:rotate(-18deg)}
button{border:0;color:#fff;font:700 18px sans-serif;touch-action:none}
#dp button{background:var(--dark);border-radius:6px}
#ab button{width:56px;height:56px;border-radius:50%;background:#a3304f}
button:focus-visible{outline:3px solid #fff}
button:active{filter:brightness(1.5)}
</style></head><body>
<div id="gba"><div id="scr"><canvas id="c" width="240" height="160"></canvas></div>
<div id="pad"><div id="dp"><span></span><button data-k="up">▲</button><span></span><button data-k="left">◀</button><span></span><button data-k="right">▶</button><span></span><button data-k="down">▼</button><span></span></div>
<div id="ab"><button data-k="b">B</button><button data-k="a">A</button></div></div></div>

function act(i){
var e=B.e,r=P.rage>0,k=r?1.8:1,m=[],d,t=0,n=0,no=0;
if(i==0){if(Math.random()<.9){d=Math.round(rnd(7,11)*k);e.hp-=d;P.g=Math.min(100,P.g+12);m.push('小七射出一箭！造成 '+d+' 傷害')}else m.push('箭射偏了！')}
else if(i==1){for(var j=0;j<3;j++)if(Math.random()<(r?1:.7)){t+=Math.round(rnd(3,6)*k);n++}e.hp-=t;P.g=Math.min(100,P.g+n*5);m.push('連射三箭，命中 '+n+' 發，共 '+t+' 傷害！')}
else if(i==2){no=1;if(r)m.push('已經是狂暴狀態了！');else if(P.g<60)m.push('怒氣不足（需要 60）。');else{P.rage=3;P.g=0;no=0;m.push('小七戴上藍色眼罩，進入狂暴！攻擊上升、受傷也增加！')}}
else if(i==3){if(!P.fish){no=1;m.push('魚乾吃完了！')}else{P.fish--;P.hp=Math.min(P.max,P.hp+16);m.push('吃下魚乾，回復 16 HP')}}
else{if(e.boss){no=1;m.push('衛隊長擋住退路，無法逃跑！')}else if(Math.random()<.6){say(['小七溜進樹叢逃走了！'],endBattle);return}else m.push('逃跑失敗！')}
say(m,no?null:function(){B.e.hp<=0?turnEnd():turnEnd2()});if(!no&&e.hp<=0)cb=turnEnd}
function turnEnd2(){turnEnd()}
function fin(){say(['稅金車被搶下來了！','小七把 '+gold+' 枚金幣分給了村民。','劫富濟貧，任務完成！'],function(){mode='end'})}
// overworld update
function check(){G.forEach(function(g){if(g.dead||g.spot||mode!='over')return;for(var k=1;k<=4;k++)if(g.x+g.d[0]*k==P.x&&g.y+g.d[1]*k==P.y){g.spot=1;g.t=0;mode='spot'}})}
function upd(){
fr++;
if(mode=='spot'){G.forEach(function(g){if(!g.spot)return;if(++g.t%10==0){if(Math.abs(g.x-P.x)+Math.abs(g.y-P.y)<=1){g.spot=0;startBattle(g)}else{g.x+=g.d[0];g.y+=g.d[1]}}})}
if(mode!='over')return;
if(P.mv>0){P.px+=P.dx*2;P.py+=P.dy*2;if(--P.mv==0){P.x=Math.round(P.px/16);P.y=Math.round(P.py/16);check()}return}
var d=held.up?[0,-1,'u']:held.down?[0,1,'d']:held.left?[-1,0,'l']:held.right?[1,0,'r']:0;
if(d){P.f=d[2];if(!solid(P.x+d[0],P.y+d[1])){P.dx=d[0];P.dy=d[1];P.mv=8}}}
function title(){
R(0,0,240,160,'#2d6a2f');R(0,100,240,60,'#5aa14a');X.drawImage(IN,8,32,96,96);X.drawImage(IR,136,32,96,96);
X.fillStyle='#fff';X.font='bold 22px "Noto Sans TC",sans-serif';X.fillText('小七俠盜',78,24);
X.font='10px sans-serif';X.fillText('按 A 開始　（方向鍵／十字鍵移動）',50,146)}
function endScr(){R(0,0,240,160,'#1d3d52');X.drawImage(IR,72,20,96,96);X.fillStyle='#ffd27a';X.font='bold 16px "Noto Sans TC",sans-serif';X.fillText('劫富濟貧完成！',70,18);X.font='10px sans-serif';X.fillStyle='#fff';X.fillText('共救回 '+gold+' 枚金幣　按 A 重玩',58,140)}
function frame(){
upd();
if(mode=='title')title();else if(mode=='end')endScr();
else{if(B&&mode!='text'){}
 if(B)(mode=='menu'?menuDraw:battleDraw)();else overDraw();
 if(mode=='text')box(msgs[0]||'',22)}
requestAnimationFrame(frame)}
function press(k){
held[k]=1;
if(mode=='title'&&k=='a'){mode='over';say(['諾丁漢的稅吏又在森林裡搜刮村民了。','小七戴上羅賓漢帽，決定劫富濟貧！','在路上小心稅吏的視線，被發現就要戰鬥。','累積怒氣到 60，就能戴上藍色眼罩狂暴！'])}
else if(mode=='end'&&k=='a')location.reload();
else if(mode=='text'&&(k=='a'||k=='b'))adv();
else if(mode=='menu'){
 if(k=='left'&&sel%2)sel--;if(k=='right'&&sel%2==0&&sel<4)sel++;if(k=='up'&&sel>1)sel-=2;if(k=='down'&&sel<3)sel+=2;
 if(k=='a'){var s=sel;mode='text';act(s)}}
else if(mode=='over'&&k=='a'&&!P.mv){var d={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]}[P.f],g=gAt(P.x+d[0],P.y+d[1]);if(g){mode='over';startBattle(g)}}}
function rel(k){held[k]=0}
var km={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',z:'a',Enter:'a',' ':'a',x:'b'};
addEventListener('keydown',function(e){var k=km[e.key];if(!k)return;e.preventDefault();if(!e.repeat)press(k)});
addEventListener('keyup',function(e){var k=km[e.key];if(k)rel(k)});
[].forEach.call(document.querySelectorAll('button'),function(b){var k=b.dataset.k;
b.addEventListener('pointerdown',function(e){e.preventDefault();press(k)});
['pointerup','pointerleave','pointercancel'].forEach(function(n){b.addEventListener(n,function(){rel(k)})})});
frame();
})();
</script></body></html>
