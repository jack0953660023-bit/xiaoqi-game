<style>
:root{--bg:#274d63;--bg2:#1d3d52;--ink:#f6f1dc;--card:#16293a;--line:#4b7a94;--accent:#ffb84d;--sub:#b9cfdb;

html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:linear-gradient(var(--bg),var(--bg2));color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;display:flex;flex-direction:column;align-items:center;padding:32px 16px 48px;box-sizing:border-box}

main{display:grid;gap:18px;width:100%;max-width:520px;margin-top:28px}
a.card{display:flex;gap:16px;align-items:center;text-decoration:none;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;transition:transform .15s,border-color .15s}

.pic{flex:none;width:96px;height:96px;border-radius:14px;background:#2d5a75;display:grid;place-items:center;font-size:44px;overflow:hidden}
.pic img{width:100%;height:100%;image-rendering:pixelated}
.txt h2{margin:0 0 4px;font-size:21px}
.txt p{margin:0 0 8px;color:var(--sub);font-size:14px;line-height:1.6}
.tag{display:inline-block;background:var(--accent);color:#2a1a05;border-radius:999px;padding:3px 14px;font-weight:700;font-size:14px}
footer{margin-top:28px;color:var(--sub);font-size:13px;text-align:center;line-height:1.7}
